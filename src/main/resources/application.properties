spring.application.name=data360-agent-console
server.port=8080

app.executor=local
app.state.store=jdbc
app.temporal.target=${TEMPORAL_TARGET:127.0.0.1:7233}
app.temporal.namespace=${TEMPORAL_NAMESPACE:default}
app.temporal.task-queue=${TEMPORAL_TASK_QUEUE:data360-plan-task-queue}
app.temporal.workflow-id-prefix=${TEMPORAL_WORKFLOW_ID_PREFIX:data360-plan}
app.temporal.worker-enabled=${TEMPORAL_WORKER_ENABLED:true}
app.data360.client=mock
app.data360.mcp.command=
app.data360.connect.api-version=${DATA360_CONNECT_API_VERSION:v66.0}
app.data360.connect.instance-url=${DATA360_CONNECT_INSTANCE_URL:}
app.data360.connect.access-token=${DATA360_CONNECT_ACCESS_TOKEN:}
app.data360.connect.salesforce-instance-url=${SALESFORCE_INSTANCE_URL:}
app.data360.connect.salesforce-access-token=${SALESFORCE_ACCESS_TOKEN:}
app.data360.connect.login-url=${SALESFORCE_LOGIN_URL:https://login.salesforce.com}
app.data360.connect.client-id=${SALESFORCE_CLIENT_ID:}
app.data360.connect.username=${SALESFORCE_USERNAME:}
app.data360.connect.private-key=${SALESFORCE_PRIVATE_KEY:}
app.data360.connect.private-key-path=${SALESFORCE_PRIVATE_KEY_PATH:}
app.data360.connect.workload-name=${DATA360_CONNECT_WORKLOAD_NAME:data360-agent-console}
app.data360.connect.timeout-seconds=${DATA360_CONNECT_TIMEOUT_SECONDS:45}
app.data360.connect.token-skew-seconds=${DATA360_CONNECT_TOKEN_SKEW_SECONDS:60}
app.llm.provider=${APP_LLM_PROVIDER:anthropic}
app.llm.model=${APP_LLM_MODEL:}
app.llm.openrouter.api-key=${OPENROUTER_API_KEY:}
app.llm.openrouter.model=${OPENROUTER_MODEL:anthropic/claude-sonnet-4.5}
app.llm.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai}
app.llm.openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:8080}
app.llm.openrouter.app-name=${OPENROUTER_APP_NAME:Data360 Agent Console}

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}

spring.datasource.url=${DATA360_AGENT_DB_URL:jdbc:h2:file:./data/data360-agent-console;AUTO_SERVER=TRUE}
spring.datasource.username=${DATA360_AGENT_DB_USERNAME:sa}
spring.datasource.password=${DATA360_AGENT_DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=${DATA360_AGENT_H2_CONSOLE:false}
