spring.application.name=data360-agent-console
server.port=8080

app.executor=local
app.data360.client=mock
app.data360.mcp.command=
app.llm.provider=${APP_LLM_PROVIDER:anthropic}
app.llm.model=${APP_LLM_MODEL:}
app.llm.openrouter.api-key=${OPENROUTER_API_KEY:}
app.llm.openrouter.model=${OPENROUTER_MODEL:anthropic/claude-sonnet-4.5}
app.llm.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai}
app.llm.openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:8080}
app.llm.openrouter.app-name=${OPENROUTER_APP_NAME:Data360 Agent Console}

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
