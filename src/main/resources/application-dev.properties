app.security.enabled=${APP_SECURITY_ENABLED:true}
app.security.mode=${APP_SECURITY_MODE:local}
app.security.required-audience=${APP_SECURITY_REQUIRED_AUDIENCE:}
app.secrets.key=${APP_SECRETS_KEY:data360-agent-console-dev-secret}

spring.datasource.url=${DATA360_AGENT_DB_URL:jdbc:h2:file:./data/data360-agent-console}
spring.datasource.username=${DATA360_AGENT_DB_USERNAME:sa}
spring.datasource.password=${DATA360_AGENT_DB_PASSWORD:}
spring.flyway.baseline-on-migrate=${DATA360_AGENT_FLYWAY_BASELINE_ON_MIGRATE:true}
