server.address=127.0.0.1
server.port=${SERVER_PORT:0}

app.security.enabled=false
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://127.0.0.1:${server.port}}
app.desktop.api-token=${DATA360_DESKTOP_API_TOKEN:}
app.llm.provider=${APP_LLM_PROVIDER:anthropic}
app.llm.openrouter.site-url=${OPENROUTER_SITE_URL:http://127.0.0.1:${server.port}}

spring.datasource.url=${DATA360_AGENT_DB_URL:jdbc:h2:file:${DATA360_AGENT_DESKTOP_HOME:${user.home}/.data360-agent-console}/data360-agent-console}
spring.datasource.username=${DATA360_AGENT_DB_USERNAME:sa}
spring.datasource.password=${DATA360_AGENT_DB_PASSWORD:}
spring.flyway.baseline-on-migrate=${DATA360_AGENT_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.h2.console.enabled=false
