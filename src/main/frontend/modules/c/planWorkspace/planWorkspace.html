<template>
    <div class="plan-layout">
        <section class="slds-card request-card">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">Request</h2>
                        <p class="slds-text-body_small slds-text-color_weak">Scenario, goal, connection readiness</p>
                    </div>
                </header>
                <span class="slds-badge">{plannerStatus}</span>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-form-element slds-m-bottom_small">
                    <label class="slds-form-element__label" for="scenario">Scenario</label>
                    <div class="slds-form-element__control">
                        <select id="scenario" class="slds-select" onchange={handleScenarioChange}>
                            <template for:each={scenarioOptions} for:item="scenario">
                                <option key={scenario.id} value={scenario.id} selected={scenario.selected}>{scenario.name}</option>
                            </template>
                        </select>
                    </div>
                </div>
                <div class="slds-form-element">
                    <label class="slds-form-element__label" for="goal">Goal</label>
                    <div class="slds-form-element__control">
                        <textarea id="goal" class="slds-textarea" oninput={handleGoalChange}>{goal}</textarea>
                    </div>
                </div>
                <div class="request-actions slds-m-top_medium">
                    <button class="slds-button slds-button_brand" onclick={handleDraft} disabled={busy.draftPlan}>{draftLabel}</button>
                    <button class="slds-button slds-button_neutral" onclick={handleApprovePlan} disabled={approveDisabled}>{approveLabel}</button>
                    <button class="slds-button slds-button_neutral" onclick={handleStart} disabled={startDisabled}>{startLabel}</button>
                    <button class="slds-button slds-button_neutral" onclick={handleExportPlanSpec} disabled={exportDisabled}>{exportLabel}</button>
                    <button class="slds-button slds-button_neutral" onclick={handleSmoke} disabled={busy.smokeData360}>{smokeLabel}</button>
                </div>
            </div>
        </section>

        <section class="slds-card plan-card">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">PlanSpec</h2>
                        <p class="slds-text-body_small slds-text-color_weak">Governed ASL profile before any Data 360 mutation</p>
                    </div>
                </header>
                        <template if:true={hasDraft}>
                            <span class={validationClass}>{validationLabel}</span>
                            <span class={approvalClass}>{approvalLabel}</span>
                        </template>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <template if:false={hasDraft}>
                    <div class="empty-state">No plan drafted.</div>
                </template>

                <template if:true={hasDraft}>
                    <div class="plan-head">
                        <div>
                            <strong>{plan.goal}</strong>
                            <p>{planContext}</p>
                        </div>
                        <span class="slds-badge">{plan.scenarioId}</span>
                    </div>

                    <div class="review-stats">
                        <template for:each={reviewStats} for:item="stat">
                            <div key={stat.label}>
                                <strong>{stat.value}</strong>
                                <span>{stat.label}</span>
                            </div>
                        </template>
                    </div>

                    <div class="governance-grid" aria-label="Plan governance">
                        <template for:each={governanceCards} for:item="card">
                            <article key={card.label} class={card.className}>
                                <span>{card.label}</span>
                                <strong>{card.value}</strong>
                                <p>{card.detail}</p>
                            </article>
                        </template>
                    </div>

                    <template if:true={hasIssues}>
                        <div class="slds-m-vertical_small issue-stack">
                            <template for:each={issues} for:item="issue">
                                <div key={issue.key} class={issue.className}>
                                    {issue.severity} • {issue.stepId} • {issue.message}
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasIssues}>
                        <div class="slds-notify slds-notify_alert validation-ok" role="status">
                            <span>No blocking issues found.</span>
                        </div>
                    </template>

                    <template if:true={hasRun}>
                        <div class="timeline" aria-label="Run timeline">
                            <template for:each={timelineSteps} for:item="step">
                                <span key={step.key} class={step.className} title={step.status}></span>
                            </template>
                        </div>
                    </template>

                    <div class="plan-view-tabs" role="tablist" aria-label="Plan views">
                        <template for:each={planViewOptions} for:item="option">
                            <button key={option.key} class={option.className} data-view={option.key} onclick={handlePlanView}>{option.label}</button>
                        </template>
                    </div>

                    <template if:true={showStepsView}>
                    <div class="table-wrap">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered plan-table">
                            <thead>
                                <tr>
                                    <th scope="col">Step</th>
                                    <th scope="col">Capability</th>
                                    <th scope="col">Phase</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Gate</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={planRows} for:item="row">
                                    <tr key={row.key} class={row.rowClass} tabindex="0" data-step-id={row.id} onclick={handleSelectStep} onkeydown={handleStepKeydown}>
                                        <th scope="row">
                                            <div class="slds-truncate" title={row.title}>{row.title}</div>
                                            <span>{row.id}</span>
                                        </th>
                                        <td>{row.resource}</td>
                                        <td>{row.phase}</td>
                                        <td><span class={row.statusClass}>{row.status}</span></td>
                                        <td><span class={row.approvalClass}>{row.approvalLabel}</span></td>
                                        <td>
                                            <template if:true={row.canApprove}>
                                                <button class="slds-button slds-button_brand slds-button_x-small" data-step-id={row.id} onclick={handleApproveStep}>Approve</button>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    </template>

                    <template if:true={showDagView}>
                        <section class="dag-panel" aria-label="Plan DAG">
                            <template if:false={hasDag}>
                                <div class="empty-state">No DAG artifact available.</div>
                            </template>
                            <template if:true={hasDag}>
                                <div class="section-header">
                                    <h3>{dagSourceLabel}</h3>
                                    <span>{dagOrderCount} nodes ordered</span>
                                </div>
                                <div class="dag-groups">
                                    <template for:each={dagRows} for:item="group">
                                        <section key={group.id} class="dag-group">
                                            <h3>{group.label}</h3>
                                            <template for:each={group.nodes} for:item="node">
                                                <button key={node.id} class={node.className} data-step-id={node.id} onclick={handleDagNode}>
                                                    <span class="dag-node-title">{node.label}</span>
                                                    <span class="dag-node-meta">{node.action}</span>
                                                    <span class="dag-node-footer">
                                                        <span>{node.effectLabel}</span>
                                                        <span>{node.gateLabel}</span>
                                                        <span>{node.status}</span>
                                                    </span>
                                                    <template if:true={node.hasWarnings}>
                                                        <span class="dag-warning">{node.warningText}</span>
                                                    </template>
                                                </button>
                                            </template>
                                        </section>
                                    </template>
                                </div>
                                <div class="dag-edge-list" aria-label="DAG edges">
                                    <template for:each={dagEdges} for:item="edge">
                                        <div key={edge.key} class={edge.className}>
                                            <strong>{edge.from}</strong>
                                            <span>{edge.type}</span>
                                            <strong>{edge.to}</strong>
                                            <template if:true={edge.label}>
                                                <small>{edge.label}</small>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </section>
                    </template>

                    <div class="visibility-grid">
                        <section class="visibility-panel registry-panel" aria-label="Registry drift">
                            <div class="section-header">
                                <h3>Registry drift</h3>
                                <span>Frozen bindings</span>
                            </div>
                            <template if:true={hasRegistryDriftSignals}>
                                <div class="signal-stack">
                                    <template for:each={registryDriftSignals} for:item="signal">
                                        <div key={signal.key} class={signal.className}>
                                            <strong>{signal.source}</strong>
                                            <span>{signal.status}</span>
                                            <p>{signal.detail}</p>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:false={hasRegistryDriftSignals}>
                                <p class="slds-text-body_small slds-text-color_weak">{registryFallback}</p>
                            </template>

                            <template if:true={hasBindingRows}>
                                <div class="binding-list">
                                    <template for:each={bindingRows} for:item="binding">
                                        <article key={binding.key} class={binding.className}>
                                            <div>
                                                <strong>{binding.resource}</strong>
                                                <span>{binding.tool}</span>
                                            </div>
                                            <dl>
                                                <div><dt>Effect</dt><dd>{binding.effect}</dd></div>
                                                <div><dt>Gate</dt><dd>{binding.approval}</dd></div>
                                                <div><dt>Schema</dt><dd>{binding.schemaHash}</dd></div>
                                                <div><dt>Registry</dt><dd>{binding.registryHash}</dd></div>
                                                <div><dt>Tool</dt><dd>{binding.toolSchemaHash}</dd></div>
                                                <div><dt>Connector</dt><dd>{binding.connectorDefinitionHash}</dd></div>
                                            </dl>
                                            <span>{binding.statusLabel}</span>
                                        </article>
                                    </template>
                                </div>
                            </template>
                        </section>

                        <section class="visibility-panel" aria-label="Redaction warnings">
                            <div class="section-header">
                                <h3>Redaction</h3>
                                <span>Export and traces</span>
                            </div>
                            <template if:true={hasRedactionRows}>
                                <div class="signal-stack">
                                    <template for:each={redactionRows} for:item="row">
                                        <div key={row.key} class={row.className}>
                                            <strong>{row.scope}</strong>
                                            <span>{row.status}</span>
                                            <p>{row.detail}</p>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </section>
                    </div>

                    <section class="approval-history">
                        <h3>Approvals</h3>
                        <template if:true={hasApprovedArtifactRows}>
                            <template for:each={approvedArtifactRows} for:item="item">
                                <div key={item.key} class="history-row plan-approval">
                                    <strong>{item.step}</strong>
                                    <span>{item.status}</span>
                                    <p>{item.detail}</p>
                                </div>
                            </template>
                        </template>
                        <template if:true={hasApprovalRows}>
                            <template for:each={approvalRows} for:item="item">
                                <div key={item.key} class="history-row">
                                    <strong>{item.step}</strong>
                                    <span>{item.status}</span>
                                    <p>{item.detail}</p>
                                </div>
                            </template>
                        </template>
                        <template if:true={showApprovalFallback}>
                            <p class="slds-text-body_small slds-text-color_weak">{approvalFallback}</p>
                        </template>
                    </section>
                </template>
            </div>
        </section>

        <aside class="slds-card inspector-card">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">Step Inspector</h2>
                        <p class="slds-text-body_small slds-text-color_weak">Inputs, bindings, outputs</p>
                    </div>
                </header>
            </div>
            <div class="slds-card__body slds-card__body_inner">
                <template if:false={hasSelectedStep}>
                    <div class="empty-state">Select a plan step.</div>
                </template>
                <template if:true={hasSelectedStep}>
                    <div class="inspector-head">
                        <strong>{selectedStep.title}</strong>
                        <span class="slds-badge">{selectedStatus}</span>
                    </div>
                    <dl class="inspector-list">
                        <div><dt>Step</dt><dd>{selectedStep.id}</dd></div>
                        <div><dt>Phase</dt><dd>{selectedStep.phase}</dd></div>
                        <div><dt>Action</dt><dd>{selectedStep.action}</dd></div>
                        <div><dt>ResultPath</dt><dd>{selectedStep.resultPath}</dd></div>
                        <div><dt>Approval</dt><dd>{selectedApproval}</dd></div>
                        <div><dt>Timing</dt><dd>{selectedTiming}</dd></div>
                    </dl>
                    <div class="json-grid">
                        <template for:each={selectedPreviews} for:item="preview">
                            <article key={preview.label} class="json-preview">
                                <strong>{preview.label}</strong>
                                <pre>{preview.value}</pre>
                            </article>
                        </template>
                    </div>
                </template>
            </div>
        </aside>
    </div>
</template>
