<template>
    <div class="app-frame">
        <template if:true={showAuthScreen}>
            <main class="auth-screen">
                <section class="auth-panel">
                    <div class="auth-brand">
                        <span class="brand-mark">D360</span>
                        <div>
                            <h1>Data 360 Agent Console</h1>
                            <p>{authSubtitle}</p>
                        </div>
                    </div>

                    <template if:true={setupRequired}>
                        <div class="auth-form">
                            <label>Organization<input class="slds-input" data-field="setupOrganizationName" value={setupOrganizationName} oninput={handleFieldChange}></label>
                            <label>Name<input class="slds-input" data-field="setupDisplayName" value={setupDisplayName} oninput={handleFieldChange}></label>
                            <label>Email<input class="slds-input" type="email" data-field="setupEmail" value={setupEmail} oninput={handleFieldChange}></label>
                            <label>Password<input class="slds-input" type="password" data-field="setupPassword" value={setupPassword} oninput={handleFieldChange}></label>
                            <button class="slds-button slds-button_brand" onclick={handleBootstrap} disabled={busy.auth}>Create organization</button>
                        </div>
                    </template>

                    <template if:false={setupRequired}>
                        <div class="auth-form">
                            <label>Email<input class="slds-input" type="email" data-field="loginEmail" value={loginEmail} oninput={handleFieldChange}></label>
                            <label>Password<input class="slds-input" type="password" data-field="loginPassword" value={loginPassword} oninput={handleFieldChange} onkeydown={handleLoginKeydown}></label>
                            <button class="slds-button slds-button_brand" onclick={handleLogin} disabled={busy.auth}>Log in</button>
                        </div>
                    </template>

                    <template if:true={error}>
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{error}</div>
                    </template>
                </section>
            </main>
        </template>

        <template if:false={showAuthScreen}>
            <aside class="side-nav">
                <div class="brand">
                    <span class="brand-mark">D360</span>
                    <strong>Agent Console</strong>
                </div>
                <nav aria-label="Workspace">
                    <template for:each={tabs} for:item="tab">
                        <a key={tab.id} class={tab.className} href={tab.href} data-tab={tab.id} onclick={handleTab}>{tab.label}</a>
                    </template>
                </nav>
                <div class="side-footer">
                    <span>{userLabel}</span>
                    <span>{modelLabel}</span>
                    <button class="slds-button slds-button_neutral" onclick={handleLogout}>Log out</button>
                </div>
            </aside>

            <main class="workspace">
                <template if:true={isChat}>
                    <c-chat-workspace
                        messages={messages}
                        planner-status={plannerStatus}
                        model-label={modelLabel}
                        user-label={userLabel}
                        current-draft={currentDraft}
                        current-run={currentRun}
                        busy={busy}
                        onsendmessage={handleChatMessage}
                        onstartplan={handleStartPlan}
                        onexportplanspec={handleExportPlanSpec}
                    ></c-chat-workspace>
                </template>

                <template if:true={isTemplates}>
                    <c-template-workspace
                        scenarios={scenarios}
                        templates={templates}
                        selected-scenario-id={selectedScenarioId}
                        current-draft={currentDraft}
                        current-run={currentRun}
                        busy={busy}
                        onscenariochange={handleScenarioChange}
                        onusetemplate={handleUseTemplate}
                        oninstantiatetemplate={handleInstantiateTemplate}
                    ></c-template-workspace>
                </template>

                <template if:true={isReview}>
                    <c-plan-workspace
                        scenarios={scenarios}
                        selected-scenario-id={selectedScenarioId}
                        goal={goal}
                        diagnostics={diagnostics}
                        planner-status={plannerStatus}
                        current-draft={currentDraft}
                        current-run={currentRun}
                        approval-history={approvalHistory}
                        approval-history-unavailable={approvalHistoryUnavailable}
                        selected-step-id={selectedStepId}
                        busy={busy}
                        onscenariochange={handleScenarioChange}
                        ongoalchange={handleGoalChange}
                        ondraftplan={handleDraftPlan}
                        onstartplan={handleStartPlan}
                        onsmokedata360={handleSmokeData360}
                        onselectstep={handleSelectStep}
                        onapprovestep={handleApproveStep}
                    ></c-plan-workspace>
                </template>

                <template if:true={isMonitors}>
                    <c-monitor-workspace
                        demo={demo}
                        monitors={monitors}
                        last-monitor-run={lastMonitorRun}
                        recommendations={recommendations}
                        recommendation-unavailable={recommendationUnavailable}
                        onrunmonitor={handleRunMonitor}
                        onrecommendationtransition={handleRecommendationTransition}
                    ></c-monitor-workspace>
                </template>

                <template if:true={isAudit}>
                    <c-audit-workspace
                        demo={demo}
                        current-draft={currentDraft}
                        current-run={currentRun}
                        diagnostics={diagnostics}
                    ></c-audit-workspace>
                </template>

                <template if:true={isAdmin}>
                    <section class="admin-grid">
                        <article class="admin-panel">
                            <h2>Model</h2>
                            <label>Provider
                                <select class="slds-select" data-field="settingsProvider" onchange={handleFieldChange}>
                                    <option value="anthropic" selected={settingsProviderIsAnthropic}>Anthropic</option>
                                    <option value="openrouter" selected={settingsProviderIsOpenRouter}>OpenRouter</option>
                                </select>
                            </label>
                            <label>Model
                                <select class="slds-select" data-field="settingsModel" onchange={handleFieldChange}>
                                    <template for:each={settingsModelOptions} for:item="option">
                                        <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                                    </template>
                                </select>
                            </label>
                            <label>API token<input class="slds-input" type="password" data-field="settingsApiKey" value={settingsApiKey} placeholder={settingsKeyStatus} oninput={handleFieldChange}></label>
                            <button class="slds-button slds-button_brand" onclick={handleSaveLlmSettings} disabled={busy.saveSettings}>Save model settings</button>
                        </article>

                        <article class="admin-panel">
                            <h2>Organizations</h2>
                            <div class="inline-form">
                                <input class="slds-input" data-field="newOrganizationName" value={newOrganizationName} placeholder="Organization name" oninput={handleFieldChange}>
                                <button class="slds-button slds-button_neutral" onclick={handleCreateOrganization} disabled={busy.createOrganization}>Create</button>
                            </div>
                            <template for:each={organizationRows} for:item="org">
                                <button key={org.id} class={org.className} data-organization-id={org.id} onclick={handleSelectOrganization}>{org.name}</button>
                            </template>
                        </article>

                        <article class="admin-panel">
                            <h2>Users</h2>
                            <div class="user-form">
                                <input class="slds-input" data-field="newUserName" value={newUserName} placeholder="Name" oninput={handleFieldChange}>
                                <input class="slds-input" type="email" data-field="newUserEmail" value={newUserEmail} placeholder="Email" oninput={handleFieldChange}>
                                <input class="slds-input" type="password" data-field="newUserPassword" value={newUserPassword} placeholder="Temporary password" oninput={handleFieldChange}>
                                <select class="slds-select" data-field="newUserRole" onchange={handleFieldChange}>
                                    <option value="MEMBER" selected={newUserRoleIsMember}>Member</option>
                                    <option value="ADMIN" selected={newUserRoleIsAdmin}>Admin</option>
                                    <option value="VIEWER" selected={newUserRoleIsViewer}>Viewer</option>
                                </select>
                                <button class="slds-button slds-button_neutral" onclick={handleCreateUser} disabled={busy.createUser}>Create user</button>
                            </div>
                            <template for:each={userRows} for:item="item">
                                <div key={item.id} class="user-row">
                                    <strong>{item.displayName}</strong>
                                    <span>{item.email} • {item.role}</span>
                                </div>
                            </template>
                        </article>
                    </section>
                </template>

                <template if:true={error}>
                    <div class="slds-notify slds-notify_alert slds-alert_error floating-alert" role="alert">{error}</div>
                </template>
                <template if:true={exportMessage}>
                    <div class="slds-notify slds-notify_alert export-toast" role="status">{exportMessage}</div>
                </template>
            </main>
        </template>
    </div>
</template>
